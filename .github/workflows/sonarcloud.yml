name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install locked tools and build the application wheel
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.txt
          python -m pip check
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .

      - name: Run tests and generate coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=pytest-results.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-evidence
          path: |
            coverage.xml
            pytest-results.xml
          if-no-files-found: error

      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
